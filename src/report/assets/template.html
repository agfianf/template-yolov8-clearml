<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{CSS}}</style>
</head>
<body>
<!-- href="" resolves to this document's own URL, which inside the ClearML DEBUG
     SAMPLES iframe is the artifact URL. No JS, and the generator never has to know
     its own address -- so the escape hatch works even if the iframe sandbox blocks
     scripts entirely. -->
<a class="banner" href="" target="_blank" rel="noopener">Open the full report in a new tab &rarr;</a>
<header class="nav glass">
  <div class="nav-in">
    <span class="brandmark">
      <span class="dot" aria-hidden="true"></span>
      <span class="brand-txt">
        <span class="eyebrow">Evaluation report</span>
        <span class="brand-run">{{RUN_NAME}}</span>
      </span>
    </span>
    <span class="nav-spacer"></span>
    <!-- Only ever visible where the floating TOC is not: it opens the same list as a
         panel rather than duplicating it as a second row of links. -->
    <button class="tgl toc-btn" id="tocbtn" type="button"
            aria-expanded="false" aria-controls="toc">Contents</button>
    <button class="tgl" id="theme" type="button" title="Toggle light / dark">Theme</button>
  </div>
</header>
<nav class="toc" id="toc" aria-label="Sections">{{TOC}}</nav>
<div class="wrap"><main class="sheet">{{SECTIONS}}</main></div>
<!-- Lets the last section scroll to the top of the viewport like every other one. A
     document that ends at its last section can never put that section under the header,
     so the contents list could highlight it but never actually reach it. -->
<div class="tail" aria-hidden="true"></div>
<div id="filterbar" hidden><span id="filtertext"></span><button id="filterclear" type="button">Clear filter</button></div>
<div class="lb" id="lb" aria-hidden="true">
  <button class="lb-btn x" id="lbclose" type="button" aria-label="Close">&times;</button>
  <button class="lb-btn prev" id="lbprev" type="button" aria-label="Previous">&#8249;</button>
  <button class="lb-btn next" id="lbnext" type="button" aria-label="Next">&#8250;</button>
  <div class="lb-stage" id="lbstage"><img id="lbimg" alt=""><svg id="lbovl" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div class="lb-bar"><span class="lb-cap" id="lbcap"></span><span class="lb-n" id="lbn"></span></div>
</div>
<style id="filter-rules"></style>
<script type="application/json" id="report-data">{{BLOB}}</script>
<script>{{SORTABLE_JS}}</script>
<script>{{REPORT_JS}}</script>
</body>
</html>
